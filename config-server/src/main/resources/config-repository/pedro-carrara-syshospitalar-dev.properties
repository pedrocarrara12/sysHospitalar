server.port=${SYSHOSPITALAR_SERVER_PORT:8080}
services.atendimento.url=${ATENDIMENTOS_SERVICE_URL:http://localhost:8081}

spring.datasource.url=${SYSHOSPITALAR_DB_URL}
spring.datasource.username=${SYSHOSPITALAR_DB_USERNAME}
spring.datasource.password=${SYSHOSPITALAR_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-dev.sql
spring.sql.init.continue-on-error=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:syshospitalar}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:syshospitalar}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

notificacoes.consumidor.ativo=${NOTIFICACOES_CONSUMIDOR_ATIVO:true}
notificacoes.email.remetente=${MAIL_FROM:nao-responder@syshospitalar.local}
notificacoes.rabbitmq.exchange=${NOTIFICACOES_EXCHANGE:atendimentos.exchange}
notificacoes.rabbitmq.routing-key=${NOTIFICACOES_ROUTING_KEY:atendimento.criado}
notificacoes.rabbitmq.queue=${NOTIFICACOES_QUEUE:notificacao-email.atendimento-criado}
notificacoes.rabbitmq.dlx=${NOTIFICACOES_DLX:atendimentos.dlx}
notificacoes.rabbitmq.dlq=${NOTIFICACOES_DLQ:notificacao-email.atendimento-criado.dlq}
notificacoes.rabbitmq.dlq-routing-key=${NOTIFICACOES_DLQ_ROUTING_KEY:atendimento.criado.falhou}

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
batch.pacientes.diretorio=${BATCH_INPUT_DIR:${java.io.tmpdir}/syshospitalar/batch}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
