server.port=${ATENDIMENTOS_SERVER_PORT:8081}

spring.datasource.url=${ATENDIMENTOS_DB_URL}
spring.datasource.username=${ATENDIMENTOS_DB_USERNAME}
spring.datasource.password=${ATENDIMENTOS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
